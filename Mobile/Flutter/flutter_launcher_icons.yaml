# Run: dart run flutter_launcher_icons
# To regenerate after changing assets/images/logo.jpg
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21
  # Adaptive icon (Android 8.0+): logo on teal background matching AppColors.primary.
  adaptive_icon_background: "#009688"
  adaptive_icon_foreground: "assets/images/logo.jpg"
  # Keep legacy launcher shape on old Android.
  adaptive_icon_monochrome: "assets/images/logo.jpg"
  web:
    generate: true
    image_path: "assets/images/logo.jpg"
    background_color: "#009688"
    theme_color: "#009688"
  windows:
    generate: true
    image_path: "assets/images/logo.jpg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.jpg"
