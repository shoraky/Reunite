name: reunitee_app
description: "Reunitee - Community platform to reunite missing children with their families."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6

  # Navigation
  auto_route: ^9.3.0

  # Firebase & Notifications
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1

  # Networking
  dio: ^5.7.0

  # Localization
  easy_localization: ^3.0.7

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Location & connectivity
  geolocator: ^13.0.2
  connectivity_plus: ^6.0.5

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  loading_animation_widget: ^1.3.0

  # Utils
  equatable: ^2.0.5
  get_it: ^7.7.0
  uuid: ^4.5.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  characters: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  auto_route_generator: ^9.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800